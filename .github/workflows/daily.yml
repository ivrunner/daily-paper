name: Daily edition

on:
  schedule:
    - cron: "0 9 * * *"    # 5 AM EDT / 4 AM EST
    - cron: "0 10 * * *"   # 6 AM EDT / 5 AM EST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4

      - name: Time gate (5 AM Eastern, once a day)
        id: gate
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          HOUR=$(TZ=America/New_York date +%H)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif { [ "$HOUR" = "05" ] || [ "$HOUR" = "06" ]; } && [ ! -f "editions/$TODAY.json" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: hour $HOUR ET, or edition $TODAY already exists."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Build The Daily
        if: steps.gate.outputs.go == 'true'
        run: python -m paper.build --out site

      - name: Save edition
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "The Daily bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions
          if ! git diff --cached --quiet; then
            git commit -m "Edition ${{ steps.gate.outputs.today }}"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.go == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.go == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
